networks:
  rag-net:
    name: rag-net
    external: false

services:
  app:
    build: .
    image: rag-app:latest
    container_name: rag-app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: localhost,127.0.0.1,qdrant
      no_proxy: localhost,127.0.0.1,qdrant

    networks:
      - rag-net

    depends_on:
      - qdrant

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant

    ports:
      - "6333:6333"

    volumes:
      - ./qdrant_data:/qdrant/storage

    networks:
      - rag-net

    restart: unless-stopped
